
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORLD DOMINION</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
* { box-sizing:border-box; }

body {
  margin:0;
  background:#171d25;
  color:#e1e5e9;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

header {
  height:65px;
  background:#202934;
  border-bottom:1px solid #394451;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
}

.logo {
  font-size:21px;
  font-weight:bold;
  letter-spacing:2px;
}

.stats {
  display:flex;
  gap:20px;
  font-size:12px;
}

.stat strong {
  display:block;
  color:#d6b779;
  font-size:15px;
  margin-top:4px;
}

main {
  display:flex;
  height:calc(100vh - 65px);
}

nav {
  width:190px;
  background:#202934;
  border-right:1px solid #394451;
  padding:15px 10px;
  flex-shrink:0;
}

nav button {
  width:100%;
  padding:13px 10px;
  margin-bottom:5px;
  text-align:left;
  background:transparent;
  border:1px solid transparent;
  color:#c6cdd5;
  cursor:pointer;
  font-size:13px;
  border-radius:4px;
}

nav button:hover,
nav button.active {
  background:#344252;
  border-color:#536273;
  color:white;
}

#map {
  flex:1;
  background:#82928d;
  min-width:0;
}

aside {
  width:275px;
  background:#202934;
  border-left:1px solid #394451;
  padding:18px;
  overflow-y:auto;
  flex-shrink:0;
}

h2 {
  font-size:17px;
  margin-top:0;
}

.section {
  border-bottom:1px solid #394451;
  padding:13px 0;
}

.label {
  color:#929eaa;
  font-size:11px;
  text-transform:uppercase;
}

.value {
  font-size:15px;
  margin-top:6px;
}

.action {
  width:100%;
  padding:11px;
  margin-top:8px;
  background:#35485b;
  color:white;
  border:1px solid #53677c;
  border-radius:4px;
  cursor:pointer;
}

#timeline {
  position:absolute;
  bottom:15px;
  left:210px;
  background:#202934;
  border:1px solid #536273;
  border-radius:5px;
  padding:10px 15px;
  display:flex;
  gap:12px;
  align-items:center;
  z-index:500;
  font-size:13px;
}

#timeline button {
  background:#35485b;
  color:white;
  border:0;
  padding:7px 11px;
  border-radius:3px;
}

.leaflet-container {
  background:#82928d;
}

@media(max-width:850px) {
  nav { width:145px; }
  aside { width:220px; }
  .stats { display:none; }
  #timeline { left:155px; }
}

@media(max-width:600px) {
  nav { width:65px; }
  nav button { font-size:0; text-align:center; }
  aside { width:180px; padding:10px; }
  #timeline { left:70px; }
}
</style>
</head>

<body>

<header>
  <div class="logo">WORLD DOMINION</div>
  <div class="stats">
    <div class="stat">TESORO<strong>—</strong></div>
    <div class="stat">PIB<strong>—</strong></div>
    <div class="stat">POBLACIÓN<strong>—</strong></div>
    <div class="stat">ESTABILIDAD<strong>—</strong></div>
  </div>
  <div id="date">01/01/2026</div>
</header>

<main>

<nav>
  <button class="active" onclick="setTab(this,'Mapa mundial')">🌍 Mapa</button>
  <button onclick="setTab(this,'Economía')">📊 Economía</button>
  <button onclick="setTab(this,'Militar')">⚔ Militar</button>
  <button onclick="setTab(this,'Diplomacia')">🤝 Diplomacia</button>
  <button onclick="setTab(this,'Gobierno')">🏛 Gobierno</button>
  <button onclick="setTab(this,'Acciones')">⚡ Acciones</button>
  <button onclick="setTab(this,'Progreso')">🏆 Progreso</button>
</nav>

<div id="map"></div>

<aside>
  <h2 id="panel-title">Información territorial</h2>
  <div class="section">
    <div class="label">País seleccionado</div>
    <div class="value" id="country">Ninguno</div>
  </div>

  <div class="section">
    <div class="label">Código del país</div>
    <div class="value" id="code">—</div>
  </div>

  <div class="section">
    <div class="label">Información económica</div>
    <div class="value">Pendiente de implementar</div>
  </div>

  <div class="section">
    <div class="label">Información militar</div>
    <div class="value">Pendiente de implementar</div>
  </div>

  <button class="action" onclick="alert('Sistema en desarrollo')">
    Ver información completa
  </button>
</aside>

</main>

<div id="timeline">
  <strong id="clock">PAUSADO</strong>
  <button onclick="setSpeed(0)">Ⅱ</button>
  <button onclick="setSpeed(1)">▶</button>
  <button onclick="setSpeed(2)">2×</button>
  <button onclick="setSpeed(4)">4×</button>
  <button onclick="setSpeed(8)">8×</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map('map', {
  center:[25,0],
  zoom:2,
  minZoom:2,
  worldCopyJump:true
});

let selectedLayer = null;

function selectCountry(feature, layer) {
  if(selectedLayer) {
    selectedLayer.setStyle({
      fillColor:'#647b80',
      fillOpacity:0.85,
      color:'#303a40',
      weight:0.7
    });
  }

  selectedLayer = layer;

  layer.setStyle({
    fillColor:'#c3a46c',
    fillOpacity:1,
    color:'#ffffff',
    weight:1.8
  });

  const p = feature.properties || {};
  const name = p.ADMIN || p.name || p.NAME || 'Territorio';
  const code = p.ISO_A3 || p.iso_a3 || '—';

  document.getElementById('country').textContent = name;
  document.getElementById('code').textContent = code;
}

fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson')
.then(response => {
  if(!response.ok) throw new Error('No se pudo cargar el mapa');
  return response.json();
})
.then(data => {
  L.geoJSON(data, {
    style: {
      fillColor:'#647b80',
      fillOpacity:0.85,
      color:'#303a40',
      weight:0.7
    },
    onEachFeature:(feature,layer) => {
      layer.on({
        click:() => selectCountry(feature,layer),
        mouseover:() => {
          if(layer !== selectedLayer)
            layer.setStyle({fillColor:'#a0b1a7'});
        },
        mouseout:() => {
          if(layer !== selectedLayer)
            layer.setStyle({fillColor:'#647b80'});
        }
      });
    }
  }).addTo(map);
})
.catch(error => {
  document.getElementById('country').textContent =
    'Error cargando el mapa';
  console.error(error);
});

function setTab(button,name) {
  document.querySelectorAll('nav button')
    .forEach(b => b.classList.remove('active'));

  button.classList.add('active');
  document.getElementById('panel-title').textContent = name;
}

let speed = 0;
let date = new Date(2026,0,1);

function setSpeed(value) {
  speed = value;
  document.getElementById('clock').textContent =
    value === 0 ? 'PAUSADO' : value+'×';
}

setInterval(() => {
  if(speed === 0) return;

  date.setDate(date.getDate()+speed);

  document.getElementById('date').textContent =
    String(date.getDate()).padStart(2,'0')+'/' +
    String(date.getMonth()+1).padStart(2,'0')+'/' +
    date.getFullYear();
},1000);
</script>

</body>
</html>
